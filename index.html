<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxler</title>
<!-- Inline icon: without it every load asks for /favicon.ico and logs a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23223'/%3E%3Cpath d='M8 2l5 3v6l-5 3-5-3V5z' fill='%236c8'/%3E%3Cpath d='M8 2l5 3-5 3-5-3z' fill='%239ea'/%3E%3Cpath d='M8 8v6l-5-3V5z' fill='%234a6'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* Centres the canvas, which only shows when it is letterboxed (see canvas.fit). */
  body { display: grid; place-items: center; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  /* It is focusable so it can take the keyboard back from a text field; the ring adds
     nothing to a picture. */
  canvas:focus { outline: none; }
  /* `?size=` renders at a fixed size, and the window is rarely that shape. Stretching
     one to the other gives the frame a pixel that is not square, so the picture's own
     aspect follows the window: a circle is an ellipse, and by how much depends on how
     the window is dragged. Fit it inside the window at the render target's aspect
     instead (main.ts sets `--fit-aspect` to it, as a plain number) and let the bars be
     black. `max-height: 100vh` would not do instead: a clamp on the height does not
     travel back to a width that was stated outright, so a short wide window stretched
     the frame just as before. */
  canvas.fit { width: min(100vw, calc(100vh * var(--fit-aspect))); height: auto; }
  #message {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem;
    color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center;
  }
  #message[hidden] { display: none; }
  #overlay {
    position: fixed; top: 0; left: 0; max-width: 100vw; max-height: 100vh; overflow: auto;
    user-select: text; cursor: text;
    box-sizing: border-box; padding: 8px 10px; background: rgba(0, 0, 0, 0.65);
    color: #d8e4ee; font: 12px/1.4 ui-monospace, monospace;
  }
  #overlay pre { margin: 0 0 8px; white-space: pre-wrap; }
  #overlay .errors { color: #ff9a9a; }
  /* The always-on panel: frame rate, switches, and what the engine is compiling.
     Top right, so it never sits under the debug overlay (F2), which is top left. */
  #hud {
    position: fixed; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: flex-end; max-width: 60vw;
    color: #d8e4ee; font: 12px/1.4 ui-monospace, monospace; user-select: none;
  }
  #hud .fps {
    min-width: 52px; text-align: right; padding: 3px 6px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.55); font-variant-numeric: tabular-nums;
  }
  #hud button {
    padding: 3px 8px; border: 1px solid rgba(216, 228, 238, 0.25); border-radius: 4px;
    background: rgba(0, 0, 0, 0.55); color: #97a7b5; font: inherit; cursor: pointer;
  }
  #hud button:hover { border-color: rgba(216, 228, 238, 0.55); color: #d8e4ee; }
  #hud button.on { background: rgba(120, 190, 150, 0.28); color: #eafff2; }
  #hud .counts {
    flex-basis: 100%; text-align: right; padding: 3px 6px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.55); color: #9fb3c4; font-variant-numeric: tabular-nums;
    /* The picked bird is a second line in the same element, so the newline has to count. */
    white-space: pre-line;
  }
  #hud .counts[hidden] { display: none; }
  #hud .note {
    flex-basis: 100%; text-align: right; padding: 3px 6px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.55); color: #cbd8e4;
  }
  #hud .note[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="message" hidden></div>
<noscript><div id="message">Voxler needs JavaScript.</div></noscript>
<script type="module" src="./main.js"></script>
</body>
</html>
